name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="splatty-agent-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w" -o "$out" .
          shasum -a 256 "$out" > "${out}.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            splatty-agent-${{ matrix.goos }}-${{ matrix.goarch }}
            splatty-agent-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
          fail_on_unmatched_files: true
